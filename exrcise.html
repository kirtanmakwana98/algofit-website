        function renderFilters() {
            filterContainer.innerHTML = CATEGORIES.map(cat => {
                const isActive = cat === activeCategory;
                return `
                    <button onclick="setCategory('${cat}')" 
                        class="px-5 py-2.5 rounded-full text-xs font-bold transition-all duration-200 uppercase tracking-wider ${
                            isActive 
                            ? 'bg-gradient-to-r from-cyanAccent to-greenAccent text-black shadow-lg shadow-cyanAccent/20 scale-105' 
                            : 'bg-cardDark text-gray-400 border border-borderDark hover:text-white hover:border-gray-600'
                        }">
                        ${cat}
                    </button>
                `;
            }).join('');
        }

        window.setCategory = function(cat) {
            activeCategory = cat;
            renderFilters();
            renderGrid();
        };

        function renderGrid() {
            const filtered = EXERCISES.filter(item => {
                const matchesCat = activeCategory === 'ALL' || item.category === activeCategory;
                const matchesSearch = item.title.toLowerCase().includes(searchQuery.toLowerCase()) || 
                                      item.primaryMuscle.toLowerCase().includes(searchQuery.toLowerCase());
                return matchesCat && matchesSearch;
            });

            if (filtered.length === 0) {
                exerciseGrid.innerHTML = '';
                noResults.classList.remove('hidden');
                return;
            }

            noResults.classList.add('hidden');
            exerciseGrid.innerHTML = filtered.map(ex => `
                <div onclick="openExerciseModal('${ex.id}')" 
                    class="glow-border bg-cardDark border border-borderDark rounded-2xl p-5 flex flex-col justify-between cursor-pointer hover:bg-cardHover transition duration-300 group">
                    <div>
                        <!-- Header / Type Badge -->
                        <div class="flex items-center justify-between mb-4">
                            <span class="text-[10px] font-extrabold uppercase px-2.5 py-1 rounded-md bg-bgDark text-cyanAccent border border-cyanAccent/20 flex items-center space-x-1.5">
                                ${getCategoryIcon(ex.category)}
                                <span>${ex.category}</span>
                            </span>
                            <span class="text-[10px] font-semibold text-gray-400 capitalize bg-bgDark px-2 py-0.5 rounded border border-borderDark">
                                ${ex.type}
                            </span>
                        </div>

                        <!-- Title -->
                        <h3 class="text-lg font-bold text-white group-hover:text-cyanAccent transition mb-3">${ex.title}</h3>

                        <!-- Specs -->
                        <div class="space-y-1 text-xs">
                            <p class="text-gray-400">
                                <span class="text-gray-500 font-medium">Primary:</span> 
                                <span class="text-gray-200 font-semibold">${ex.primaryMuscle}</span>
                            </p>
                            <p class="text-gray-400 truncate">
                                <span class="text-gray-500 font-medium">Secondary:</span> 
                                <span class="text-gray-400">${ex.secondaryMuscles.join(', ')}</span>
                            </p>
                        </div>
                    </div>

                    <!-- Footer Action Callout -->
                    <div class="mt-6 pt-3 border-t border-borderDark/60 flex items-center justify-between text-xs text-cyanAccent font-semibold">
                        <span>View Details & Calc</span>
                        <svg class="w-4 h-4 transform group-hover:translate-x-1 transition" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/>
                        </svg>
                    </div>
                </div>
            `).join('');
        }

        window.openExerciseModal = function(id) {
            const ex = EXERCISES.find(e => e.id === id);
            if (!ex) return;

            modalTitle.innerText = ex.title;
            modalCategoryBadge.innerText = ex.category;
            modalPrimaryMuscle.innerText = ex.primaryMuscle;
            modalCategoryType.innerText = `${ex.type} Lift`;

            modalSecondaryMuscles.innerHTML = ex.secondaryMuscles.map(m => 
                `<span class="text-xs bg-bgDark border border-borderDark text-gray-300 px-2.5 py-1 rounded-md font-medium">${m}</span>`
            ).join('');

            modalStepsContainer.innerHTML = `
                <div class="bg-bgDark p-4 rounded-xl border border-borderDark">
                    <span class="text-xs font-bold text-cyanAccent tracking-wider uppercase block mb-1">1. Setup</span>
                    <p class="text-xs text-gray-300 leading-relaxed">${ex.steps.setup}</p>
                </div>
                <div class="bg-bgDark p-4 rounded-xl border border-borderDark">
                    <span class="text-xs font-bold text-cyanAccent tracking-wider uppercase block mb-1">2. Initiate</span>
                    <p class="text-xs text-gray-300 leading-relaxed">${ex.steps.initiate}</p>
                </div>
                <div class="bg-bgDark p-4 rounded-xl border border-borderDark">
                    <span class="text-xs font-bold text-cyanAccent tracking-wider uppercase block mb-1">3. Descent</span>
                    <p class="text-xs text-gray-300 leading-relaxed">${ex.steps.descent}</p>
                </div>
                <div class="bg-bgDark p-4 rounded-xl border border-borderDark">
                    <span class="text-xs font-bold text-cyanAccent tracking-wider uppercase block mb-1">4. Ascent / Lockout</span>
                    <p class="text-xs text-gray-300 leading-relaxed">${ex.steps.ascent}</p>
                </div>
            `;

            buildCalculator(ex);

            exerciseModal.classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        };

        function buildCalculator(ex) {
            if (ex.type === 'compound') {
                calculatorTitle.innerHTML = `
                    <span class="flex items-center space-x-2">
                        <svg class="w-5 h-5 text-cyanAccent" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z"/></svg>
                        <span>1RM & Training Intensity Estimator</span>
                    </span>
                    <span class="text-xs font-semibold text-cyanAccent bg-cyanAccent/10 px-2.5 py-0.5 rounded border border-cyanAccent/30">Compound Metrics</span>
                `;
                calculatorSubtitle.innerText = 'Calculate estimated 1 Rep Max and targeted training load targets based on recent set performance.';

                calculatorForm.innerHTML = `
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">Lifted Weight (kg)</label>
                        <input type="number" id="calcWeight" value="100" min="1" max="500" class="w-full bg-bgDark border border-borderDark rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-cyanAccent">
                    </div>
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">Reps Performed</label>
                        <input type="number" id="calcReps" value="5" min="1" max="30" class="w-full bg-bgDark border border-borderDark rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-cyanAccent">
                    </div>
                    <div class="flex items-end">
                        <button onclick="calculate1RM()" class="w-full bg-gradient-to-r from-cyanAccent to-greenAccent text-black font-bold py-2 px-4 rounded-lg text-sm hover:opacity-90 transition">
                            Calculate 1RM
                        </button>
                    </div>
                `;

                calculate1RM();

            } else {
                calculatorTitle.innerHTML = `
                    <span class="flex items-center space-x-2">
                        <svg class="w-5 h-5 text-greenAccent" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
                        <span>Total Volume & Energy Burn Calculator</span>
                    </span>
                    <span class="text-xs font-semibold text-greenAccent bg-greenAccent/10 px-2.5 py-0.5 rounded border border-greenAccent/30">Hypertrophy Metrics</span>
                `;
                calculatorSubtitle.innerText = 'Estimate total workout tonnage and calories burned for this isolation exercise set.';

                calculatorForm.innerHTML = `
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">Weight / Resistance (kg)</label>
                        <input type="number" id="calcVolWeight" value="25" min="0" max="300" class="w-full bg-bgDark border border-borderDark rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-cyanAccent">
                    </div>
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">Reps Per Set</label>
                        <input type="number" id="calcVolReps" value="12" min="1" max="100" class="w-full bg-bgDark border border-borderDark rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-cyanAccent">
                    </div>
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">Number of Sets</label>
                        <input type="number" id="calcVolSets" value="4" min="1" max="20" class="w-full bg-bgDark border border-borderDark rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-cyanAccent">
                    </div>
                `;

                document.getElementById('calcVolWeight').addEventListener('input', calculateVolume);
                document.getElementById('calcVolReps').addEventListener('input', calculateVolume);
                document.getElementById('calcVolSets').addEventListener('input', calculateVolume);

                calculateVolume();
            }
        }

        window.calculate1RM = function() {
            const w = parseFloat(document.getElementById('calcWeight')?.value) || 0;
            const r = parseFloat(document.getElementById('calcReps')?.value) || 0;

            if (w <= 0 || r <= 0) return;

            const oneRM = r === 1 ? w : Math.round(w * (1 + r / 30));
            const target85 = Math.round(oneRM * 0.85);
            const target70 = Math.round(oneRM * 0.70);

            calculatorResults.innerHTML = `
                <div class="bg-bgDark p-3.5 rounded-xl border border-borderDark text-center">
                    <span class="text-[11px] text-gray-400 block uppercase tracking-wider font-medium">Estimated 1RM</span>
                    <span class="text-2xl font-extrabold text-gradient">${oneRM} <span class="text-sm font-normal text-gray-400">kg</span></span>
                </div>
                <div class="bg-bgDark p-3.5 rounded-xl border border-borderDark text-center">
                    <span class="text-[11px] text-gray-400 block uppercase tracking-wider font-medium">85% 1RM (5-Rep Target)</span>
                    <span class="text-xl font-bold text-cyanAccent">${target85} <span class="text-xs font-normal text-gray-400">kg</span></span>
                </div>
                <div class="bg-bgDark p-3.5 rounded-xl border border-borderDark text-center">
                    <span class="text-[11px] text-gray-400 block uppercase tracking-wider font-medium">70% 1RM (10-Rep Target)</span>
                    <span class="text-xl font-bold text-greenAccent">${target70} <span class="text-xs font-normal text-gray-400">kg</span></span>
                </div>
            `;
        };

        window.calculateVolume = function() {
            const w = parseFloat(document.getElementById('calcVolWeight')?.value) || 0;
            const r = parseFloat(document.getElementById('calcVolReps')?.value) || 0;
            const s = parseFloat(document.getElementById('calcVolSets')?.value) || 0;

            const totalVolume = Math.round(w * r * s);
            const estCalories = Math.round((s * r * 0.85) + (totalVolume * 0.012));

            calculatorResults.innerHTML = `
                <div class="bg-bgDark p-3.5 rounded-xl border border-borderDark text-center">
                    <span class="text-[11px] text-gray-400 block uppercase tracking-wider font-medium">Total Workload Tonnage</span>
                    <span class="text-2xl font-extrabold text-gradient">${totalVolume.toLocaleString()} <span class="text-sm font-normal text-gray-400">kg</span></span>
                </div>
                <div class="bg-bgDark p-3.5 rounded-xl border border-borderDark text-center">
                    <span class="text-[11px] text-gray-400 block uppercase tracking-wider font-medium">Total Reps Completed</span>
                    <span class="text-xl font-bold text-cyanAccent">${s * r} <span class="text-xs font-normal text-gray-400">reps</span></span>
                </div>
                <div class="bg-bgDark p-3.5 rounded-xl border border-borderDark text-center">
                    <span class="text-[11px] text-gray-400 block uppercase tracking-wider font-medium">Est. Calories Burned</span>
                    <span class="text-xl font-bold text-greenAccent">~${estCalories} <span class="text-xs font-normal text-gray-400">kcal</span></span>
                </div>
            `;
        };

        // Event Listeners
        closeModalBtn.addEventListener('click', () => {
            exerciseModal.classList.add('hidden');
            document.body.style.overflow = 'auto';
        });

        exerciseModal.addEventListener('click', (e) => {
            if (e.target === exerciseModal) {
                exerciseModal.classList.add('hidden');
                document.body.style.overflow = 'auto';
            }
        });

        searchInput.addEventListener('input', (e) => {
            searchQuery = e.target.value;
            renderGrid();
        });

        window.onload = function() {
            renderFilters();
            renderGrid();
        };
    </script>
</body>
</html>
